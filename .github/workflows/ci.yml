name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies (CPU-only torch on Linux)
        run: uv sync --frozen --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Unit tests (synthetic data only)
        run: uv run pytest --cov --cov-report=term-missing

      - name: LightGBM unit tests (separate process, mirrors macOS OpenMP isolation)
        run: uv run pytest -o addopts="-ra --strict-markers -m 'not data and not slow'" tests/lgbm

      - name: Browser demo parity test (JS port of the predictor vs Python vectors)
        run: node tests/web/test_core.mjs

      - name: CLI smoke test
        run: uv run battery-rul --help
