[project]
name = "battery-rul"
version = "0.1.0"
description = "Leakage-free benchmark and calibrated iTransformer models for Li-ion battery SOH, capacity forecasting and Remaining Useful Life."
readme = "README.md"
authors = [{ name = "Anurag Jha" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "lightgbm>=4.3",
    "optuna>=4.0",
    "mlflow>=2.16",
    "hydra-core>=1.3",
    "pydantic>=2.7",
    "pandera>=0.20",
    "typer>=0.12",
    "matplotlib>=3.9",
    "h5py>=3.11",
    "openpyxl>=3.1",
    "rich>=13",
    "python-calamine>=0.9.1",
]

[project.optional-dependencies]
app = [
    "gradio>=5.0",
    "huggingface_hub>=0.25",
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[project.scripts]
battery-rul = "battery_rul.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "properscoring>=0.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
    "pandas-stubs",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# CPU-only torch wheels on Linux (CI / HF Spaces) to avoid multi-GB CUDA downloads.
# macOS uses the default PyPI wheel, which includes MPS support.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "PD", "RUF"]
ignore = [
    "N803",   # argument names like X are conventional in ML code
    "N806",   # variable names like X, H are conventional in ML code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["battery_rul"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not data and not slow'"
markers = [
    "data: requires real datasets in data/raw (skipped in CI)",
    "slow: long-running integration tests (skipped by default)",
]

[tool.coverage.run]
source = ["battery_rul"]
branch = true
