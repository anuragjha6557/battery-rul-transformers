name: patchtst
# Channel-independent foil to iTransformer. At the largest corners the FFN width / head are shrunk
# to respect the shared 250k-parameter cap (PROTOCOL §6); see models/patchtst.py.
params: {patch_len: 8, d_model: 64, n_heads: 4, n_layers: 2, dropout: 0.1, channels: soh, lookback: 32, lr: 1.0e-3, weight_decay: 1.0e-4}
search:
  lr: {type: float, low: 1.0e-5, high: 3.0e-2, log: true}
  weight_decay: {type: float, low: 1.0e-8, high: 1.0e-2, log: true}
  lookback: {type: categorical, choices: [16, 32, 64]}
  patch_len: {type: categorical, choices: [4, 8, 16]}
  d_model: {type: categorical, choices: [32, 64, 128]}
  n_heads: {type: categorical, choices: [2, 4]}
  n_layers: {type: int, low: 1, high: 3}
  dropout: {type: float, low: 0.0, high: 0.3}
