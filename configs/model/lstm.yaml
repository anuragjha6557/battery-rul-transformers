name: lstm
params:
  cell: lstm
  hidden: 64
  layers: 2
  dropout: 0.1
  lookback: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
search:
  lr: {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
  weight_decay: {type: float, low: 1.0e-8, high: 1.0e-2, log: true}
  lookback: {type: categorical, choices: [16, 32, 64]}
  hidden: {type: categorical, choices: [32, 64, 128]}
  layers: {type: int, low: 1, high: 2}
  dropout: {type: float, low: 0.0, high: 0.3}
