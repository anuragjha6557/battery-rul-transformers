name: itransformer
# iTransformer (Liu et al. 2024), channels=all: the paper's multi-channel (MC) model.
# Search space identical to configs/model/transformer.yaml (ADR-0006). The FFN shrinks only at
# the d_model=128 x n_layers=3 corner, to respect the 250k parameter cap.
params: {d_model: 64, n_heads: 4, n_layers: 2, dropout: 0.1, channels: all, use_tab: true, lookback: 32, lr: 1.0e-3, weight_decay: 1.0e-4}
search:
  lr: {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
  weight_decay: {type: float, low: 1.0e-8, high: 1.0e-2, log: true}
  lookback: {type: categorical, choices: [16, 32, 64]}
  d_model: {type: categorical, choices: [32, 64, 128]}
  n_heads: {type: categorical, choices: [2, 4]}
  n_layers: {type: int, low: 1, high: 3}
  dropout: {type: float, low: 0.0, high: 0.3}
