name: transformer
# Note: at the d_model=128 x n_layers=3 corner the FFN width is shrunk (ff_mult < 4) so the
# model respects the shared 250k-parameter cap (PROTOCOL §6); the effective width is logged.
params:
  d_model: 64
  n_heads: 4
  n_layers: 2
  dropout: 0.1
  lookback: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
search:
  lr: {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
  weight_decay: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
  lookback: {type: categorical, choices: [16, 32, 64]}
  d_model: {type: categorical, choices: [32, 64, 128]}
  n_heads: {type: categorical, choices: [2, 4]}
  n_layers: {type: int, low: 1, high: 3}
  dropout: {type: float, low: 0.0, high: 0.3}
