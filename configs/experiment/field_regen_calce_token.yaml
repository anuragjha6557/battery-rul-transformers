# @package _global_
# ADR-0020 Stage 3 regeneration arm (iTransformer past+future rest variate token), calce: forecast given the planned rest schedule.
# Lookbacks = field_final F-B lookbacks, so each arm pairs with its field_final baseline.
defaults:
  - /experiment_schema
  - _self_

name: field_regen
datasets: [calce]
tasks: [forecast]
feature_set: field_curve
clean: true
future_rest_seq: 100
models:
  - tuned: itransformer__forecast
    params: {lookback: 32, channels: all, rest_token: true}
seeds: [0, 1, 2, 3, 4]
lookback: 64
eval_origins: [start_points, all]
