# @package _global_
# Isolation smoke test: torch (nlinear) and LightGBM (lgbm) models in ONE experiment, n_jobs=1.
# Must complete without OpenMP crashes (models/registry.py, runner OpenMP isolation).
# Run: battery-rul benchmark --config smoke_mixed
defaults:
  - /experiment_schema
  - _self_

name: smoke_mixed
datasets: [calce]
tasks: [forecast]
models:
  - name: persistence
  - name: lgbm
    params: {n_estimators: 200, quantile: false, lookback: 32}
  - name: nlinear
    params: {lookback: 32, max_epochs: 30, quantiles: null}
seeds: [0]
lookback: 32
eval_origins: [start_points, all]
allow_untuned: true
