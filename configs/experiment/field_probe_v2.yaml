# @package _global_
# PLAN_PHASE2 Stage 0e probe: field SOH estimation (no SOH/capacity inputs) - do field signals beat
# age alone? Cheap models only, 1 seed. ADR-0018 cleaning on.
defaults:
  - /experiment_schema
  - _self_

name: field_probe_v2
datasets: [toyota]
tasks: [soh]
feature_set: field_curve
clean: true
models:
  - name: age_only
  - tuned: lgbm__soh
  - tuned: elasticnet__soh
seeds: [0]
lookback: 32
eval_origins: [start_points, all]
train_stride: {toyota: 4}
