# @package _global_
# PLAN_PHASE2 Stage 2 (ADR-0020): long-lookback test, L in {32,128} (512 dropped 2026-11-21, ADR-0020); tuned params reused, lookback overridden.
defaults:
  - /experiment_schema
  - _self_

name: field_lookback
datasets: [toyota]
tasks: [soh, forecast]
feature_set: field
clean: true
models:
  - tuned: patchtst__soh
    params: {lookback: 32}
  - tuned: patchtst__soh
    params: {lookback: 128}
  - tuned: patchtst__forecast
    params: {lookback: 32}
  - tuned: patchtst__forecast
    params: {lookback: 128}
seeds: [0, 1, 2]
lookback: 64
eval_origins: [start_points, all]
train_stride: {toyota: 4}
