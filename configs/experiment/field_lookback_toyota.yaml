# @package _global_
# PLAN_PHASE2 Stage 2 (ADR-0020): long-lookback test, L in {32,128,512}; tuned params reused, lookback overridden.
defaults:
  - /experiment_schema
  - _self_

name: field_lookback
datasets: [toyota]
tasks: [soh, forecast]
feature_set: field
clean: true
models:
  - tuned: itransformer__soh
    params: {lookback: 32, channels: all}
  - tuned: itransformer__soh
    params: {lookback: 128, channels: all}
  - tuned: itransformer__soh
    params: {lookback: 512, channels: all}
  - tuned: itransformer__forecast
    params: {lookback: 32, channels: all}
  - tuned: itransformer__forecast
    params: {lookback: 128, channels: all}
  - tuned: itransformer__forecast
    params: {lookback: 512, channels: all}
  - tuned: transformer__soh
    params: {lookback: 32}
  - tuned: transformer__soh
    params: {lookback: 128}
  - tuned: transformer__soh
    params: {lookback: 512}
  - tuned: transformer__forecast
    params: {lookback: 32}
  - tuned: transformer__forecast
    params: {lookback: 128}
  - tuned: transformer__forecast
    params: {lookback: 512}
  - tuned: lstm__soh
    params: {lookback: 32}
  - tuned: lstm__soh
    params: {lookback: 128}
  - tuned: lstm__soh
    params: {lookback: 512}
  - tuned: lstm__forecast
    params: {lookback: 32}
  - tuned: lstm__forecast
    params: {lookback: 128}
  - tuned: lstm__forecast
    params: {lookback: 512}
seeds: [0, 1, 2]
lookback: 64
eval_origins: [start_points, all]
train_stride: {toyota: 4}
